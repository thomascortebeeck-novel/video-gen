<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio — AI film production</title>
    <meta name="description" content="Turn photos and a story form into multi-scene AI films." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!-- The mark: a 16:9 gate and a 9:16 gate overlapping — one master, two cuts. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='8' width='28' height='16' rx='3' fill='none' stroke='%23F0A93C' stroke-width='2.5'/%3E%3Crect x='10' y='2' width='12' height='28' rx='3' fill='none' stroke='%238CB4EE' stroke-width='2.5'/%3E%3C/svg%3E"
    />
    <script>
      // Stamp the theme before first paint so the page never flashes the wrong one.
      (function () {
        try {
          var t = localStorage.getItem('studio-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* private mode — fall back to the OS preference */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
